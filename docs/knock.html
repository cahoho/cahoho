<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Someone is at the door. Go on, knock.">
<meta name="theme-color" content="#0b1220">
<title>Knock Knock · cahoho</title>
<style>
  :root{
    --wall-1:#0b1220; --wall-2:#16233f;
    --ink:#e9efff; --muted:#93a4c8;
    --door-1:#33528f; --door-2:#223a72; --door-3:#182a57;
    --frame-1:#3d62ad; --frame-2:#253c74;
    --brass-1:#f7e9b4; --brass-2:#d8b766; --brass-3:#a9843a; --brass-4:#f0dc9c;
    --spill:rgba(255,206,138,.55);
    --accent:#5b8cff; --ring:rgba(91,140,255,.5);
    --chip:rgba(255,255,255,.055); --line:rgba(255,255,255,.13);
  }
  @media (prefers-color-scheme: light){
    :root{
      --wall-1:#f6f8fd; --wall-2:#dfe8fa;
      --ink:#0f172a; --muted:#5b6b8c;
      --spill:rgba(255,191,105,.5);
      --accent:#2563eb; --ring:rgba(37,99,235,.35);
      --chip:rgba(15,23,42,.035); --line:rgba(15,23,42,.12);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; padding:44px 20px 56px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--ink); text-align:center;
    background:radial-gradient(1200px 640px at 50% -10%, var(--wall-2), var(--wall-1)) fixed;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .eyebrow{
    margin:0 0 30px; font-size:12px; letter-spacing:.26em; text-transform:uppercase; color:var(--muted);
  }

  /* ---- doorway ---- */
  .stage{position:relative}
  .frame{
    position:relative; padding:13px 13px 15px; border-radius:8px 8px 4px 4px;
    perspective:1100px; perspective-origin:50% 45%;
    background:linear-gradient(180deg, var(--frame-1), var(--frame-2));
    box-shadow:
      0 34px 60px -28px rgba(0,0,0,.8),
      0 0 0 1px rgba(255,255,255,.06),
      inset 0 2px 0 rgba(255,255,255,.16),
      inset 0 -3px 6px rgba(0,0,0,.4);
  }
  .frame::before{ /* recessed reveal around the door */
    content:""; position:absolute; inset:11px 11px 13px; border-radius:5px;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.45), inset 0 6px 14px -6px rgba(0,0,0,.7);
    pointer-events:none;
  }
  .door{
    position:relative; display:block; width:250px; height:352px; padding:0; border:0;
    cursor:pointer; transform-style:preserve-3d; transform-origin:left center; border-radius:4px;
    background:
      linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 4px),
      radial-gradient(120% 90% at 20% 8%, rgba(255,255,255,.14), transparent 58%),
      linear-gradient(168deg, var(--door-1), var(--door-2) 48%, var(--door-3));
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.09),
      inset -12px 0 26px -18px rgba(0,0,0,.9),
      8px 6px 20px -10px rgba(0,0,0,.8);
    transition:filter .25s ease;
  }
  .door:hover{filter:brightness(1.06)}
  .door:focus-visible{outline:3px solid var(--accent); outline-offset:6px}
  .door.knocking{animation:knock .45s cubic-bezier(.2,.9,.25,1)}
  .door::before{
    content:""; position:absolute; inset:0; border-radius:4px; pointer-events:none;
    box-shadow:
      inset 22px 0 26px -26px rgba(255,255,255,.35),
      inset -22px 0 26px -26px rgba(0,0,0,.55);
  }
  .panel{
    position:absolute; left:30px; right:30px; border-radius:5px; pointer-events:none;
    box-shadow:
      inset 0 3px 0 rgba(0,0,0,.42),
      inset 0 -2px 0 rgba(255,255,255,.13),
      inset 3px 0 0 rgba(0,0,0,.3),
      inset -2px 0 0 rgba(255,255,255,.07),
      inset 0 0 22px rgba(0,0,0,.36);
  }
  .panel-top{top:34px; height:104px}
  .panel-bottom{top:160px; height:172px}
  .hinge{
    position:absolute; left:-3px; width:9px; height:30px; border-radius:2px;
    background:linear-gradient(90deg, var(--brass-3), var(--brass-1) 40%, var(--brass-2) 70%, var(--brass-3));
    box-shadow:0 2px 4px rgba(0,0,0,.5);
  }
  .hinge-top{top:64px}
  .hinge-bottom{bottom:64px}
  .knocker{
    position:absolute; left:50%; top:96px; transform:translateX(-50%);
    width:62px; height:62px; pointer-events:none;
  }
  .knocker::before{
    content:""; position:absolute; left:50%; top:2px; transform:translateX(-50%);
    width:26px; height:14px; border-radius:4px 4px 8px 8px;
    background:linear-gradient(180deg, var(--brass-1), var(--brass-2) 55%, var(--brass-3));
    box-shadow:0 3px 6px rgba(0,0,0,.5);
  }
  .ring{
    position:absolute; left:50%; top:14px; transform:translateX(-50%);
    width:42px; height:42px; border-radius:50%; border:5px solid transparent;
    background:
      linear-gradient(var(--door-2), var(--door-2)) padding-box,
      linear-gradient(155deg, var(--brass-1), var(--brass-3) 45%, var(--brass-4) 68%, var(--brass-2)) border-box;
    box-shadow:0 4px 8px -2px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.25);
    transform-origin:50% 6%;
  }
  .door.knocking .ring{animation:swing .45s cubic-bezier(.3,.9,.3,1)}
  .knob{
    position:absolute; right:26px; top:50%; width:22px; height:22px; margin-top:-11px; border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #fff8dc, var(--brass-2) 45%, var(--brass-3));
    box-shadow:0 3px 7px rgba(0,0,0,.6), inset 0 -2px 3px rgba(0,0,0,.35);
  }
  .keyhole{
    position:absolute; right:31px; top:calc(50% + 26px); width:12px; height:18px;
    border-radius:6px 6px 3px 3px;
    background:linear-gradient(180deg, #0a0f0a, #1c2233);
    box-shadow:inset 0 0 0 1.5px var(--brass-2), 0 1px 2px rgba(0,0,0,.5);
  }
  .spill{
    position:absolute; left:50%; bottom:-9px; transform:translateX(-50%);
    width:74%; height:16px; border-radius:50%;
    background:radial-gradient(ellipse at center, var(--spill), transparent 70%);
    filter:blur(4px); pointer-events:none;
  }
  .ripple{
    position:absolute; left:50%; top:47%; width:88px; height:88px; margin:-44px 0 0 -44px;
    border-radius:50%; border:2px solid var(--accent); opacity:0; pointer-events:none;
  }
  .ripple.go{animation:ripple .62s ease-out}
  .toast{
    position:absolute; left:50%; top:86px; z-index:3; transform:translate(-50%,14px);
    font-size:15px; font-weight:800; letter-spacing:.3em; text-transform:uppercase;
    color:#d3e2ff; opacity:0; pointer-events:none; white-space:nowrap;
    text-shadow:0 0 14px rgba(91,140,255,.9), 0 2px 10px rgba(0,0,0,.6);
  }
  .toast.go{animation:fly .78s ease-out}

  h1{margin:34px 0 8px; font-size:26px; letter-spacing:.02em}
  .hint{margin:0; color:var(--muted); font-size:15px}
  .counter{
    margin:26px 0 0; display:inline-flex; align-items:baseline; gap:10px;
    padding:13px 26px; border-radius:999px; background:var(--chip);
    box-shadow:inset 0 0 0 1px var(--line);
  }
  .num{font-size:38px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
  .num.pop{animation:pop .28s ease-out}
  .unit{font-size:14px; color:var(--muted)}
  .status{margin:16px 0 0; min-height:22px; font-size:14px; color:var(--muted)}
  .sync{
    display:inline-block; margin-left:8px; padding:2px 9px; border-radius:999px;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    background:var(--chip); box-shadow:inset 0 0 0 1px var(--line);
    opacity:0; transition:opacity .3s ease;
  }
  .sync.on{opacity:1}
  .back{
    margin-top:32px; font-size:14px; color:var(--muted); text-decoration:none;
    border-bottom:1px solid transparent; padding-bottom:2px;
  }
  .back:hover{color:var(--accent); border-color:currentColor}
  .mute{
    position:fixed; right:18px; top:18px; width:40px; height:40px; cursor:pointer;
    border-radius:50%; border:1px solid var(--line); background:var(--chip); color:var(--muted);
    font-size:16px; line-height:1;
  }
  .mute:hover{color:var(--ink)}

  @keyframes knock{
    0%{transform:rotateY(0deg) translateZ(0)}
    16%{transform:rotateY(-7.5deg) translateZ(-7px)}
    42%{transform:rotateY(2.6deg) translateZ(2px)}
    64%{transform:rotateY(-1.15deg) translateZ(-1px)}
    82%{transform:rotateY(.45deg)}
    100%{transform:rotateY(0deg) translateZ(0)}
  }
  @keyframes swing{
    0%,100%{transform:translateX(-50%) rotate(0deg)}
    22%{transform:translateX(-50%) rotate(15deg)}
    54%{transform:translateX(-50%) rotate(-9deg)}
    78%{transform:translateX(-50%) rotate(4deg)}
  }
  @keyframes ripple{
    0%{opacity:.9; transform:scale(.5)}
    100%{opacity:0; transform:scale(3.2)}
  }
  @keyframes fly{
    0%{opacity:0; transform:translate(-50%,12px) scale(.9)}
    20%{opacity:1; transform:translate(-50%,-2px) scale(1.04)}
    100%{opacity:0; transform:translate(-50%,-40px) scale(1)}
  }
  @keyframes pop{
    0%{transform:scale(1)}
    40%{transform:scale(1.18)}
    100%{transform:scale(1)}
  }
  @media (prefers-reduced-motion: reduce){
    .door.knocking,.door.knocking .ring,.ripple.go,.toast.go,.num.pop{animation:none!important}
  }
  @media (max-width:430px){
    .door{width:210px; height:296px}
    .panel-top{top:28px; height:88px}
    .panel-bottom{top:134px; height:142px}
    .knocker{top:80px; transform:translateX(-50%) scale(.9)}
    h1{font-size:22px}
    .num{font-size:32px}
  }
</style>
</head>
<body>

  <p class="eyebrow">cahoho</p>

  <div class="stage">
    <div class="frame">
      <button class="door" id="door" type="button" aria-label="Knock on the door">
        <span class="panel panel-top"></span>
        <span class="panel panel-bottom"></span>
        <span class="hinge hinge-top"></span>
        <span class="hinge hinge-bottom"></span>
        <span class="knocker"><span class="ring"></span></span>
        <span class="knob"></span>
        <span class="keyhole"></span>
        <span class="ripple" id="ripple"></span>
      </button>
      <span class="spill"></span>
    </div>
    <span class="toast" id="toast">thud</span>
  </div>

  <h1>Someone's at the door</h1>
  <p class="hint">Go on — rap on it as fast as you like</p>

  <div class="counter">
    <span class="num" id="count">–</span>
    <span class="unit">knocks</span>
  </div>

  <p class="status"><span id="statusText">Reading the counter…</span><span class="sync" id="sync">syncing</span></p>
  <a class="back" href="https://github.com/cahoho">← back to GitHub profile</a>

  <button class="mute" id="mute" type="button" aria-label="Toggle sound" title="Toggle sound">🔊</button>

<script>
(function () {
  var NAMESPACE = "cahoho.github.io";
  var KEY = "knock";
  var API = "https://abacus.jasoncameron.dev";

  // The counter API allows 30 requests per IP every 10s, and the public endpoint
  // only counts one at a time. So taps are always instant locally and the server
  // is fed from a queue at a safe rate.
  var FLUSH_INTERVAL = 380;   // ~2.6 hits/s, comfortably under the limit
  var RETRY_SLOW = 1500;
  var RETRY_429 = 5000;
  var MAX_QUEUE = 600;
  var DEDUPE_MS = 30;

  var door = document.getElementById("door");
  var ripple = document.getElementById("ripple");
  var toast = document.getElementById("toast");
  var countEl = document.getElementById("count");
  var statusText = document.getElementById("statusText");
  var syncEl = document.getElementById("sync");
  var muteBtn = document.getElementById("mute");

  var base = 0;      // last value confirmed by the server
  var queued = 0;    // taps accepted, not sent yet
  var inflight = 0;  // taps sent, waiting for a response
  var known = false; // whether base has ever been read
  var draining = false;
  var nextSlot = 0;  // earliest moment the next request may leave
  var timer = null;
  var soundOn = true;
  var lastTap = 0;

  function total() { return base + queued + inflight; }

  function paint(pop) {
    if (!known && total() === 0) {
      countEl.textContent = "–";
    } else {
      countEl.textContent = total();
      if (pop) {
        countEl.classList.remove("pop");
        void countEl.offsetWidth;
        countEl.classList.add("pop");
      }
    }
    syncEl.classList.toggle("on", queued + inflight > 0);
    if (known) syncEl.textContent = "syncing " + (queued + inflight);
  }

  function load() {
    fetch(API + "/get/" + NAMESPACE + "/" + KEY)
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        base = d.value;
        known = true;
        paint(false);
        statusText.textContent = "Connected — every tap goes straight to the counter";
      })
      .catch(function () {
        statusText.textContent = "Counter is unreachable — taps are queued and will be sent later";
      });
  }

  function tok() {
    if (!soundOn) return;
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = tok.ctx || (tok.ctx = new Ctx());
    if (ctx.state === "suspended") ctx.resume();
    var t = ctx.currentTime;
    var wobble = 1 + (Math.random() * 0.18 - 0.09);

    var body = ctx.createOscillator();
    var gain = ctx.createGain();
    body.type = "triangle";
    body.frequency.setValueAtTime(325 * wobble, t);
    body.frequency.exponentialRampToValueAtTime(94 * wobble, t + 0.045);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.32, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    body.connect(gain).connect(ctx.destination);
    body.start(t);
    body.stop(t + 0.18);

    var len = Math.floor(ctx.sampleRate * 0.045);
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
    }
    var src = ctx.createBufferSource();
    var band = ctx.createBiquadFilter();
    var ng = ctx.createGain();
    band.type = "bandpass";
    band.frequency.value = 1750 * wobble;
    band.Q.value = 0.9;
    ng.gain.setValueAtTime(0.2, t);
    ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
    src.buffer = buf;
    src.connect(band).connect(ng).connect(ctx.destination);
    src.start(t);
  }

  function schedule(ms) {
    if (timer) return;
    timer = setTimeout(function () { timer = null; drain(); }, Math.max(ms, 16));
  }

  function drain() {
    if (draining || queued <= 0) return;
    var now = Date.now();
    if (now < nextSlot) { schedule(nextSlot - now); return; }

    draining = true;
    queued--;
    inflight++;
    paint(false);

    nextSlot = now + FLUSH_INTERVAL;
    fetch(API + "/hit/" + NAMESPACE + "/" + KEY)
      .then(function (r) {
        if (r.status === 429) throw new Error("429");
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function (d) {
        base = d.value;
        known = true;
        inflight--;
        paint(false);
      })
      .catch(function (err) {
        inflight--;
        queued++;
        nextSlot = Date.now() + (String(err.message) === "429" ? RETRY_429 : RETRY_SLOW);
        paint(false);
      })
      .then(function () {
        draining = false;
        if (queued > 0) schedule(nextSlot - Date.now());
      });
  }

  function knock() {
    var now = Date.now();
    if (now - lastTap < DEDUPE_MS) return;
    lastTap = now;

    if (queued + inflight < MAX_QUEUE) {
      queued++;
    }

    door.classList.remove("knocking");
    void door.offsetWidth;
    door.classList.add("knocking");
    ripple.classList.remove("go");
    void ripple.offsetWidth;
    ripple.classList.add("go");
    toast.style.left = (50 + (Math.random() * 12 - 6)).toFixed(2) + "%";
    toast.classList.remove("go");
    void toast.offsetWidth;
    toast.classList.add("go");
    tok();
    paint(true);
    drain();
  }

  door.addEventListener("click", knock);

  document.addEventListener("keydown", function (e) {
    if (e.code !== "Space" && e.code !== "Enter") return;
    if (e.repeat) return;                       // key repeat would flood the queue
    if (e.target === door) return;              // the focused button fires its own click
    if (e.target !== document.body) return;     // leave other controls alone
    e.preventDefault();
    knock();
  });

  muteBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    muteBtn.textContent = soundOn ? "🔊" : "🔇";
    muteBtn.setAttribute("aria-label", soundOn ? "Mute" : "Unmute");
  });

  // flush whatever is left before the tab goes away
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") drain();
  });

  paint(false);
  load();
})();
</script>
</body>
</html>
